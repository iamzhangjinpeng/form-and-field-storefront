name: Validate and deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages (enable Pages in repository settings first)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outputs.ready || steps.skip.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase deployment credentials
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          DEPLOY_REQUESTED: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [ "$DEPLOY_REQUESTED" != "true" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment credentials are not configured; the Pages build will remain in demo mode."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.ready == 'true'
        with:
          version: latest
      - name: Deploy Supabase Edge Functions
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          SUPABASE_PROJECT_REF="${SUPABASE_URL#https://}"
          SUPABASE_PROJECT_REF="${SUPABASE_PROJECT_REF%%.*}"
          supabase functions deploy checkout --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy session --project-ref "$SUPABASE_PROJECT_REF" --use-api
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Mark Supabase unavailable
        id: skip
        if: steps.credentials.outputs.ready != 'true'
        run: echo "ready=false" >> "$GITHUB_OUTPUT"
  build:
    needs: deploy-supabase
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ needs.deploy-supabase.outputs.deployed == 'true' && vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ needs.deploy-supabase.outputs.deployed == 'true' && vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
